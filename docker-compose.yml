version: '3.9'

# =============================================================================
# NestJS GraphQL Microservices — Docker Compose
# Spins up two isolated PostgreSQL instances (one per service) + pgAdmin
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL for auth-service
  # ---------------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - '5433:5432'
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL for users-service
  # ---------------------------------------------------------------------------
  users-db:
    image: postgres:16-alpine
    container_name: users_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    ports:
      - '5434:5432'
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin — web UI for both databases
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@msakithub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_secret}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      auth-db:
        condition: service_healthy
      users-db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - microservices-net

volumes:
  auth_db_data:
  users_db_data:
  pgadmin_data:

networks:
  microservices-net:
    driver: bridge
